{% extends "base.html" %}
{% block title %}Add address — CollegeDB{% endblock %}
{% block content %}
<h1>Add address — {{ person.display_name }}</h1>
<div class="card">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn">Save address</button>
    <a class="btn secondary" href="{% url 'person_detail' person.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
